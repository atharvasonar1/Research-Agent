[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtm-account-research"
version = "0.1.0"
description = "Evidence-backed one-domain real estate account research agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=3.19.2,<4", "jsonschema>=4.18,<5", "httpx2>=2.12,<3", "truststore>=0.10,<1"]

[project.scripts]
gtm-research = "gtm_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
