[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtm-account-research"
version = "0.1.0"
description = "Foundation for an evidence-backed real estate account research agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
gtm-research = "gtm_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
